
server{
    listen 443 ssl;
    server_name gustgonz.42.fr;

    root    /var/www/wordpress;
    #default file to find
    index   index.html index.php;

    #ssl setting
    ssl_certificate /etc/ssl/certificat.crt;
    ssl_certificate_key /etc/ssl/certificat.key;
    ssl_protocols  TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    #static content location
    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    #fastcgi setting 
    location ~ \.php {
        include fastcgi_params; #path of setting of fastcgi 
        fastcgi_index index.php; # si la requête PHP vise un répertoire, index.php est utilisé par défaut
        fastcgi_pass  wordpress:9000; #connect to php-fpm in wordpress
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;

	fastcgi_param HTTP_HOST $http_host;

	fastcgi_param HTTPS on;

	fastcgi_param SERVER_PORT $server_port;
    }

    #deny acces of hidden files
    location ~ /\. {
        deny all;
    }
}
